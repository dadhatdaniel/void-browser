<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Void</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Tab Bar -->
  <div id="tab-bar">
    <div id="tabs-container"></div>
    <button id="new-tab-btn" title="New Tab (Ctrl+T)">+</button>
    <div id="window-controls">
      <div id="block-counter" title="Ads & trackers blocked this session">
        <span id="block-count">0</span>
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
          <path d="M8 1a7 7 0 100 14A7 7 0 008 1zM4.5 7.5h7v1h-7z"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Navigation Bar -->
  <div id="nav-bar">
    <div id="nav-buttons">
      <button id="back-btn" class="nav-btn" title="Back" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <button id="forward-btn" class="nav-btn" title="Forward" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>
      <button id="reload-btn" class="nav-btn" title="Reload (Ctrl+R)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
        </svg>
      </button>
    </div>

    <div id="url-bar-container">
      <div id="security-indicator">
        <svg id="lock-icon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM12 17c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM9 8V6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9z"/>
        </svg>
      </div>
      <input type="text" id="url-bar" placeholder="Search or enter URL" spellcheck="false" autocomplete="off">
    </div>

    <div id="nav-actions">
      <button id="shield-btn" class="nav-btn" title="Privacy Shield">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
        </svg>
      </button>
      <button id="settings-btn" class="nav-btn" title="Settings (Ctrl+,)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Browser Content Area -->
  <div id="content-area">
    <!-- New Tab Page -->
    <div id="newtab-page" class="active">
      <div id="newtab-content">
        <h1 id="void-logo">VOID</h1>
        <p id="void-tagline">No tracking. No AI. Just browsing.</p>
        <div id="search-container">
          <input type="text" id="search-input" placeholder="Search with DuckDuckGo" spellcheck="false" autofocus>
        </div>
        <div id="stats-display">
          <div class="stat">
            <span class="stat-value" id="stat-blocked">0</span>
            <span class="stat-label">blocked this session</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Settings Page -->
    <div id="settings-page">
      <div id="settings-content">
        <h2>Settings</h2>

        <section class="settings-group">
          <h3>🔒 Security Level</h3>
          <div class="setting-row">
            <label>
              <input type="radio" name="security" value="Standard"> Standard
              <span class="setting-desc">Block ads & trackers, strip referrers</span>
            </label>
          </div>
          <div class="setting-row">
            <label>
              <input type="radio" name="security" value="Strict" checked> Strict
              <span class="setting-desc">+ Block third-party cookies, prevent WebRTC leaks</span>
            </label>
          </div>
          <div class="setting-row">
            <label>
              <input type="radio" name="security" value="Paranoid"> Paranoid
              <span class="setting-desc">+ Fingerprint resistance, block JS by default</span>
            </label>
          </div>
        </section>

        <section class="settings-group">
          <h3>🎨 Appearance</h3>
          <div class="setting-row">
            <label>Theme</label>
            <select id="theme-select">
              <option value="dark">Dark</option>
              <option value="light">Light</option>
              <option value="midnight">Midnight (OLED)</option>
            </select>
          </div>
          <div class="setting-row">
            <label>Font Size</label>
            <input type="range" id="font-size" min="10" max="20" value="14">
            <span id="font-size-display">14px</span>
          </div>
          <div class="setting-row toggle-row">
            <label>Compact Mode</label>
            <input type="checkbox" id="compact-mode">
          </div>
        </section>

        <section class="settings-group">
          <h3>🔍 Search Engine</h3>
          <div class="setting-row">
            <select id="search-engine">
              <option value="duckduckgo">DuckDuckGo</option>
              <option value="brave">Brave Search</option>
              <option value="startpage">Startpage</option>
              <option value="searxng">SearXNG</option>
            </select>
          </div>
        </section>

        <section class="settings-group">
          <h3>🛡️ Privacy</h3>
          <div class="setting-row toggle-row">
            <label>Ad Blocker</label>
            <input type="checkbox" id="adblock-toggle" checked>
          </div>
          <div class="setting-row toggle-row">
            <label>Tracker Blocking</label>
            <input type="checkbox" id="tracker-toggle" checked>
          </div>
          <div class="setting-row toggle-row">
            <label>HTTPS-Only Mode</label>
            <input type="checkbox" id="https-toggle" checked>
          </div>
          <div class="setting-row toggle-row">
            <label>Fingerprint Resistance</label>
            <input type="checkbox" id="fingerprint-toggle" checked>
          </div>
          <div class="setting-row">
            <label>DNS over HTTPS</label>
            <select id="doh-select">
              <option value="https://dns.quad9.net/dns-query">Quad9</option>
              <option value="https://cloudflare-dns.com/dns-query">Cloudflare</option>
              <option value="https://dns.mullvad.net/dns-query">Mullvad</option>
              <option value="">Disabled</option>
            </select>
          </div>
          <div class="setting-row toggle-row">
            <label>Clear Cache on Exit</label>
            <input type="checkbox" id="clear-cache-toggle" checked>
          </div>
          <div class="setting-row toggle-row">
            <label>Clear History on Exit</label>
            <input type="checkbox" id="clear-history-toggle">
          </div>
        </section>

        <section class="settings-group">
          <h3>ℹ️ About</h3>
          <div class="about-info">
            <p><strong>Void Browser</strong> v0.1.0</p>
            <p>No tracking. No AI. Just browsing.</p>
            <p class="about-link">github.com/lightfootcloud/void-browser</p>
          </div>
        </section>
      </div>
    </div>

    <!-- Webview container for actual browsing -->
    <div id="webview-container"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
