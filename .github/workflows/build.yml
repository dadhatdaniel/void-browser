# ═══════════════════════════════════════════════════
# Void Browser — Build All Platforms (GitHub Actions)
#
# Builds native installers on free GitHub runners:
#   - Linux: .deb + .AppImage (ubuntu-latest)
#   - Windows: .msi + .exe (windows-latest)
#   - macOS: .dmg (macos-latest)
#
# Triggers on tags pushed from GitLab (v* only for release).
# All artifacts attached to GitHub Release.
# When TAURI_SIGNING_PRIVATE_KEY is set on the `release`
# environment, also signs updater artifacts and publishes
# latest.json for in-app updates.
#
# Security (see docs/SECURITY.md):
#   - Default permissions: contents: read (least privilege)
#   - contents: write only on the release job
#   - Signing secrets only on refs/tags/v* via environment `release`
#   - NEVER add pull_request triggers that receive signing secrets
#   - Require reviewers on GitHub Environment `release` when possible
#
# Source of truth: GitLab (lightfootcloud/void-browser)
# Website deploy stays on GitLab CI.
# ═══════════════════════════════════════════════════

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  # Manual rebuilds allowed; signing + GitHub Release publish only on v* tags.
  workflow_dispatch:

# Least privilege by default. Release job elevates contents: write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux ──────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Signing secrets live on Environment `release` (not exposed to PRs).
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'build' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf jq

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Configure updater signing
        env:
          # Only inject signing key on version tags (never untrusted PR contexts).
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "No TAURI_SIGNING_PRIVATE_KEY on this ref — building without updater artifacts"
            jq '.bundle.createUpdaterArtifacts = false' src-tauri/tauri.conf.json > /tmp/tauri.conf.json
            mv /tmp/tauri.conf.json src-tauri/tauri.conf.json
          else
            echo "Updater signing key present — createUpdaterArtifacts enabled"
          fi

      - name: Download full filter lists
        run: |
          cd filters
          curl -sfL "https://easylist.to/easylist/easylist.txt" -o easylist-full.txt
          curl -sfL "https://easylist.to/easylist/easyprivacy.txt" -o easyprivacy-full.txt
          wc -l easylist-full.txt easyprivacy-full.txt

      - name: Build Linux packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: cargo tauri build

      - name: List artifacts
        run: |
          echo "=== Linux Packages ==="
          find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.sig' \) -exec ls -lh {} \;
          echo ""
          echo "=== Checksums ==="
          find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' \) -exec sha256sum {} \;

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: void-browser-linux-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig

  # ── Windows ────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'build' }}
    # secrets cannot be referenced in step `if:` — map presence to env first
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Configure updater signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "No TAURI_SIGNING_PRIVATE_KEY on this ref — building without updater artifacts"
            jq '.bundle.createUpdaterArtifacts = false' src-tauri/tauri.conf.json > /tmp/tauri.conf.json
            mv /tmp/tauri.conf.json src-tauri/tauri.conf.json
          else
            echo "Updater signing key present — createUpdaterArtifacts enabled"
          fi

      - name: Download full filter lists
        shell: bash
        run: |
          cd filters
          curl -sfL "https://easylist.to/easylist/easylist.txt" -o easylist-full.txt
          curl -sfL "https://easylist.to/easylist/easyprivacy.txt" -o easyprivacy-full.txt
          wc -l easylist-full.txt easyprivacy-full.txt

      - name: Build Windows packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: cargo tauri build

      # Optional Authenticode signing — requires GitHub secrets WINDOWS_CERT_PFX + WINDOWS_CERT_PASSWORD
      # See docs/CODE_SIGNING.md. Skipped when secrets are absent (unsigned early-access builds).
      - name: Sign Windows packages
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.HAS_WINDOWS_CERT == 'true' }}
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "void-codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $files = @()
          $files += Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          $files += Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            Write-Host "Signing $($f.FullName)"
            & signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              /f $pfx /p $env:WINDOWS_CERT_PASSWORD $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($f.Name)" }
          }
          Remove-Item $pfx -Force -ErrorAction SilentlyContinue

      - name: List artifacts
        shell: bash
        run: |
          echo "=== Windows Packages ==="
          find src-tauri/target/release/bundle -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.sig' \) -exec ls -lh {} \;

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: void-browser-windows-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig

  # ── macOS ──────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'build' }}
    # secrets cannot be referenced in step `if:` — map presence to env first
    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_APPLE_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_ID_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Configure updater signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "No TAURI_SIGNING_PRIVATE_KEY on this ref — building without updater artifacts"
            jq '.bundle.createUpdaterArtifacts = false' src-tauri/tauri.conf.json > /tmp/tauri.conf.json
            mv /tmp/tauri.conf.json src-tauri/tauri.conf.json
          else
            echo "Updater signing key present — createUpdaterArtifacts enabled"
          fi

      - name: Download full filter lists
        run: |
          cd filters
          curl -sfL "https://easylist.to/easylist/easylist.txt" -o easylist-full.txt
          curl -sfL "https://easylist.to/easylist/easyprivacy.txt" -o easyprivacy-full.txt
          wc -l easylist-full.txt easyprivacy-full.txt

      - name: Import Apple signing certificate
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.HAS_APPLE_CERTIFICATE == 'true' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          CERT_PATH="$RUNNER_TEMP/void-apple.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/void-signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Build macOS package
        env:
          # Tauri uses these when present; empty = unsigned early-access build
          APPLE_SIGNING_IDENTITY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_ID_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_TEAM_ID || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: cargo tauri build

      # Optional notarization — requires Apple Developer Program + secrets (docs/CODE_SIGNING.md)
      - name: Notarize and staple macOS DMG
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.HAS_APPLE_NOTARY == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          set -euo pipefail
          DMG=$(find src-tauri/target/release/bundle/dmg -name '*.dmg' | head -n1)
          test -n "$DMG"
          echo "Submitting $DMG for notarization..."
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"
          echo "Notarization + staple complete"

      - name: List artifacts
        run: |
          echo "=== macOS Package ==="
          find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.sig' \) -exec ls -lh {} \;
          echo ""
          echo "=== Checksums ==="
          find src-tauri/target/release/bundle -name '*.dmg' -exec shasum -a 256 {} \;

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: void-browser-macos-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/macos/*.sig

  # ── Release (tags only) ────────────────────────
  release:
    needs: [build-linux, build-windows, build-macos]
    # Publish only from version tags — never from workflow_dispatch on a branch.
    if: always() && contains(needs.*.result, 'success') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Generate updater latest.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: dadhatdaniel/void-browser
          ARTIFACTS_DIR: artifacts
          OUT: artifacts/latest.json
        run: bash scripts/generate-updater-manifest.sh

      - name: List all release files
        run: |
          echo "=== All Release Artifacts ==="
          find artifacts -type f | sort
          echo ""
          echo "=== Checksums ==="
          find artifacts -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.tar.gz' \) -exec sha256sum {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.sig
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.tar.gz
            artifacts/latest.json
          tag_name: ${{ github.ref_name }}
          name: "Void Browser ${{ github.ref_name }}"
          make_latest: true
          body: |
            ## Void Browser ${{ github.ref_name }}

            **No tracking. No AI. Just browsing.**

            ### Downloads
            | Platform | Format |
            |----------|--------|
            | 🐧 Linux | `.deb` (Debian/Ubuntu), `.AppImage` (universal) |
            | 🪟 Windows | `.msi` (installer), `.exe` (NSIS) |
            | 🍎 macOS | `.dmg` |

            ### In-app updates
            This release publishes `latest.json` for the Tauri updater
            (`https://github.com/dadhatdaniel/void-browser/releases/latest/download/latest.json`).
            Clients verify updater signatures with the public key embedded in the app
            before install — GitHub access alone cannot push a trusted update.
            Installed builds: Settings → Check for updates (HTTPS to GitHub only — no telemetry).

            ### Verify your download
            ```
            sha256sum --check CHECKSUMS  # Linux
            shasum -a 256 -c CHECKSUMS   # macOS
            ```

            ### What's included
            - Built-in ad blocker (137K+ filter rules)
            - HTTPS-only mode
            - Anti-fingerprinting
            - Zero telemetry
            - DNS over HTTPS

            **Website:** [void.lightfoot.cloud](https://void.lightfoot.cloud)
            **Security model:** [docs/SECURITY.md](https://github.com/dadhatdaniel/void-browser/blob/main/docs/SECURITY.md)
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
