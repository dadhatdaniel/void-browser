# ═══════════════════════════════════════════════════
# Void Browser — Build All Platforms (GitHub Actions)
#
# Builds native installers on free GitHub runners:
#   - Linux: .deb + .AppImage (ubuntu-latest)
#   - Windows: .msi + .exe (windows-latest)
#   - macOS: .dmg (macos-latest)
#
# Triggers on tags pushed from GitLab.
# All artifacts attached to GitHub Release.
#
# Source of truth: GitLab (lightfootcloud/void-browser)
# Website deploy stays on GitLab CI.
# ═══════════════════════════════════════════════════

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux ──────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Download full filter lists
        run: |
          cd filters
          curl -sfL "https://easylist.to/easylist/easylist.txt" -o easylist-full.txt
          curl -sfL "https://easylist.to/easylist/easyprivacy.txt" -o easyprivacy-full.txt
          wc -l easylist-full.txt easyprivacy-full.txt

      - name: Build Linux packages
        run: cargo tauri build

      - name: List artifacts
        run: |
          echo "=== Linux Packages ==="
          find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' \) -exec ls -lh {} \;
          echo ""
          echo "=== Checksums ==="
          find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' \) -exec sha256sum {} \;

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: void-browser-linux-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  # ── Windows ────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Download full filter lists
        shell: bash
        run: |
          cd filters
          curl -sfL "https://easylist.to/easylist/easylist.txt" -o easylist-full.txt
          curl -sfL "https://easylist.to/easylist/easyprivacy.txt" -o easyprivacy-full.txt
          wc -l easylist-full.txt easyprivacy-full.txt

      - name: Build Windows packages
        run: cargo tauri build

      - name: List artifacts
        shell: bash
        run: |
          echo "=== Windows Packages ==="
          find src-tauri/target/release/bundle -type f \( -name '*.msi' -o -name '*.exe' \) -exec ls -lh {} \;

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: void-browser-windows-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  # ── macOS ──────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Download full filter lists
        run: |
          cd filters
          curl -sfL "https://easylist.to/easylist/easylist.txt" -o easylist-full.txt
          curl -sfL "https://easylist.to/easylist/easyprivacy.txt" -o easyprivacy-full.txt
          wc -l easylist-full.txt easyprivacy-full.txt

      - name: Build macOS package
        run: cargo tauri build

      - name: List artifacts
        run: |
          echo "=== macOS Package ==="
          find src-tauri/target/release/bundle -name '*.dmg' -exec ls -lh {} \;
          echo ""
          echo "=== Checksums ==="
          find src-tauri/target/release/bundle -name '*.dmg' -exec shasum -a 256 {} \;

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: void-browser-macos-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg

  # ── Release ────────────────────────────────────
  release:
    needs: [build-linux, build-windows, build-macos]
    if: always() && contains(needs.*.result, 'success') && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: List all release files
        run: |
          echo "=== All Release Artifacts ==="
          find artifacts -type f | sort
          echo ""
          echo "=== Checksums ==="
          find artifacts -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) -exec sha256sum {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
          tag_name: ${{ github.ref_name }}
          name: "Void Browser ${{ github.ref_name }}"
          body: |
            ## Void Browser ${{ github.ref_name }}

            **No tracking. No AI. Just browsing.**

            ### Downloads
            | Platform | Format |
            |----------|--------|
            | 🐧 Linux | `.deb` (Debian/Ubuntu), `.AppImage` (universal) |
            | 🪟 Windows | `.msi` (installer), `.exe` (NSIS) |
            | 🍎 macOS | `.dmg` |

            ### Verify your download
            ```
            sha256sum --check CHECKSUMS  # Linux
            shasum -a 256 -c CHECKSUMS   # macOS
            ```

            ### What's included
            - Built-in ad blocker (137K+ filter rules)
            - HTTPS-only mode
            - Anti-fingerprinting
            - Zero telemetry
            - DNS over HTTPS

            **Website:** [void.lightfoot.cloud](https://void.lightfoot.cloud)
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
