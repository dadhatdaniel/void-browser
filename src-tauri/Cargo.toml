[package]
name = "void-browser"
version = "0.1.0-alpha.11"
description = "Void — A minimal, secure, privacy-first browser"
authors = ["Daniel Lightfoot"]
license = "GPL-3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking"] }
# Disable object-pooling / unsync-regex-caching so Engine is Send+Sync for Tauri state
adblock = { version = "0.9", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
url = "2"
dirs = "5"
toml = "0.8"
once_cell = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
# Pin: rmp 0.8.15 removed decode helpers that rmp-serde 0.15.x (via adblock) still needs
rmp = "=0.8.14"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
