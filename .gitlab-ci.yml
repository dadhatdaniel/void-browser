# ═══════════════════════════════════════════════════
# Void Browser — GitLab CI/CD Pipeline
# Lint, build, package, deploy — fully automated
# ═══════════════════════════════════════════════════

stages:
  - prepare
  - lint
  - build
  - package
  - deploy-site

variables:
  CARGO_HOME: /tmp/cargo
  RUST_BACKTRACE: "1"

# ── Download Filter Lists ─────────────────────────

prepare-filters:
  stage: prepare
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - cd filters
    - echo "Downloading full EasyList..."
    - curl -sL "https://easylist.to/easylist/easylist.txt" -o easylist-full.txt
    - echo "Downloading full EasyPrivacy..."
    - curl -sL "https://easylist.to/easylist/easyprivacy.txt" -o easyprivacy-full.txt
    - wc -l easylist-full.txt easyprivacy-full.txt
  artifacts:
    paths:
      - filters/easylist-full.txt
      - filters/easyprivacy-full.txt
    expire_in: 7 days
  only:
    - main
    - tags
    - merge_requests

# ── Lint & Check ──────────────────────────────────

lint:
  stage: lint
  image: rust:1.80
  needs: ["prepare-filters"]
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
  script:
    - cd src-tauri
    - rustup component add clippy rustfmt
    - cargo fmt --check
    - cargo clippy -- -D warnings
  cache:
    key: rust-lint-cache
    paths:
      - src-tauri/target/
  only:
    - merge_requests
    - main

# ── Build (Linux) ────────────────────────────────

build-linux:
  stage: build
  image: rust:1.80
  needs: ["prepare-filters"]
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
  script:
    - cd src-tauri
    - cargo build --release
  artifacts:
    paths:
      - src-tauri/target/release/void-browser
    expire_in: 7 days
  cache:
    key: rust-build-cache
    paths:
      - src-tauri/target/
  only:
    - main
    - tags

# ── Package (Linux — .deb + .AppImage) ───────────

package-linux:
  stage: package
  image: rust:1.80
  needs: ["build-linux"]
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
    - cargo install tauri-cli --version "^2"
  script:
    - cargo tauri build
  artifacts:
    paths:
      - src-tauri/target/release/bundle/deb/*.deb
      - src-tauri/target/release/bundle/appimage/*.AppImage
    expire_in: 90 days
  only:
    - tags

# ── Deploy Website (auto on main push) ───────────

deploy-site:
  stage: deploy-site
  image: alpine:latest
  needs: []
  before_script:
    - apk add --no-cache openssh-client docker-cli
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p 22 $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - echo "Deploying Void website to $DEPLOY_HOST..."
    # Copy website files
    - scp -o StrictHostKeyChecking=no website/index.html website/style.css website/Dockerfile root@$DEPLOY_HOST:/mnt/user/appdata/lightfootcloud/websites/void-browser/
    # Build and deploy container
    - |
      ssh -o StrictHostKeyChecking=no root@$DEPLOY_HOST "
        cd /mnt/user/appdata/lightfootcloud/websites/void-browser && \
        docker build -t void-website . && \
        docker stop void-website 2>/dev/null || true && \
        docker rm void-website 2>/dev/null || true && \
        docker run -d --name void-website --restart unless-stopped \
          -p 5080:80 \
          --network proxynet \
          void-website && \
        echo 'Website deployed successfully'
      "
  only:
    - main
  variables:
    DEPLOY_HOST: "10.0.0.10"
