# ═══════════════════════════════════════════════════
# Void Browser — GitLab CI (Internal)
#
# BUILDS: All builds (Linux/Windows/macOS) run on GitHub Actions
#         See: .github/workflows/build.yml
#         Repo: https://github.com/dadhatdaniel/void-browser
#
# THIS PIPELINE HANDLES:
#   1. LINT (every push) — code quality gates
#   2. SECURITY (main + tags) — vulnerability + license audit
#   3. DEPLOY-SITE (main) — website deployment with health checks
#
# TO CREATE A RELEASE:
#   git tag v0.1.0 && git push origin v0.1.0
#   → GitLab mirror pushes to GitHub → Actions builds all 3 platforms
# ═══════════════════════════════════════════════════

stages:
  - lint
  - security
  - deploy-site

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  RUST_BACKTRACE: "1"
  RUSTFLAGS: "-D warnings"
  RUST_IMAGE: "rust:latest"

# ── LINT ─────────────────────────────────────────

rustfmt:
  stage: lint
  image: "${RUST_IMAGE}"
  before_script:
    - apt-get update -qq && apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
  script:
    - rustc --version && cargo --version
    - cd src-tauri && rustup component add rustfmt && cargo fmt --check
  cache:
    key: lint-${CI_COMMIT_REF_SLUG}
    paths: [.cargo/, src-tauri/target/]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

clippy:
  stage: lint
  image: "${RUST_IMAGE}"
  before_script:
    - apt-get update -qq && apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
  script:
    - cd src-tauri && rustup component add clippy && cargo clippy --all-targets -- -D warnings
  allow_failure: true
  cache:
    key: clippy-${CI_COMMIT_REF_SLUG}
    paths: [.cargo/, src-tauri/target/]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ── SECURITY ─────────────────────────────────────

cargo-audit:
  stage: security
  image: "${RUST_IMAGE}"
  before_script:
    - apt-get update -qq && apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
  script:
    - cargo install cargo-audit --locked
    - cd src-tauri && cargo audit
  cache:
    key: audit-${CI_COMMIT_REF_SLUG}
    paths: [.cargo/, src-tauri/target/]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

license-check:
  stage: security
  image: "${RUST_IMAGE}"
  before_script:
    - apt-get update -qq && apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
  script:
    - cargo install cargo-license --locked
    - cd src-tauri && cargo license --json > /tmp/licenses.json
    - python3 -c "import json; deps=json.load(open('/tmp/licenses.json')); blocked=['SSPL-1.0','BUSL-1.1']; bad=[f'{d[\"name\"]}={d.get(\"license\",\"\")}' for d in deps if any(d.get('license','').startswith(b) for b in blocked)]; print('BLOCKED - ' + str(bad)) if bad else print(f'All {len(deps)} deps OK'); exit(1) if bad else None"
  cache:
    key: license-${CI_COMMIT_REF_SLUG}
    paths: [.cargo/, src-tauri/target/]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ── DEPLOY WEBSITE ───────────────────────────────

deploy-site:
  stage: deploy-site
  image: alpine:latest
  needs: []
  before_script:
    - apk add --no-cache openssh-client curl
    - mkdir -p ~/.ssh
    - cp "$DEPLOY_SSH_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p 22 $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - echo "=== Deploying Void Browser Website ==="
    - scp -o StrictHostKeyChecking=no website/index.html website/style.css website/Dockerfile website/robots.txt website/sitemap.xml website/ai.txt website/tdmrep.json website/favicon.ico website/favicon-32.png website/favicon-192.png website/favicon-512.png website/apple-touch-icon.png website/site.webmanifest website/manifest.json root@$DEPLOY_HOST:/mnt/user/appdata/lightfootcloud/websites/void-browser/
    - ssh -o StrictHostKeyChecking=no root@$DEPLOY_HOST "cd /mnt/user/appdata/lightfootcloud/websites/void-browser && docker build -t void-website . && docker stop void-website 2>/dev/null; docker rm void-website 2>/dev/null; docker run -d --name void-website --restart unless-stopped -p 5080:80 --network proxynet --memory=128m --security-opt no-new-privileges:true void-website"
    - sleep 5
    - ssh -o StrictHostKeyChecking=no root@$DEPLOY_HOST "curl -sf http://localhost:5080/ > /dev/null && echo 'Health check PASSED' || (echo 'Health check FAILED' && exit 1)"
    - ssh -o StrictHostKeyChecking=no root@$DEPLOY_HOST "curl -sI http://localhost:5080/ | grep -E '^(X-|Referrer|Content-Security|Permissions)'"
    - ssh -o StrictHostKeyChecking=no root@$DEPLOY_HOST "curl -s http://localhost:5080/ | grep -qi '<script[^>]*google-analytics' && echo 'TRACKING FOUND' && exit 1 || echo 'No tracking scripts - PASSED'"
    - echo "=== Deployment verified ==="
    - echo "Live at https://void.lightfoot.cloud"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - website/**/*
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  variables:
    DEPLOY_HOST: "10.0.0.10"
