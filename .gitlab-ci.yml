# ═══════════════════════════════════════════════════
# Void Browser — CI/CD Pipeline
# End-to-end: Lint → Audit → Build → Package → Sign → Release → Deploy
#
# WHAT CREATES DOWNLOADABLE PACKAGES:
#   package-linux (on tags) → .deb + .AppImage via Tauri bundler
#   sign-packages (on tags) → GPG signs + SHA-256 checksums
#   release (on tags) → Creates GitLab Release with download links
#   deploy-site (on main) → Deploys website container
# ═══════════════════════════════════════════════════

stages:
  - lint
  - security
  - build
  - package
  - release
  - deploy-site

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  RUST_BACKTRACE: "1"
  RUSTFLAGS: "-D warnings"
  # Use latest stable Rust (needs 1.85+ for edition2024 deps)
  RUST_IMAGE: "rust:latest"

# ══════════════════════════════════════════════════
# STAGE 1: LINT — Code quality gates
# ══════════════════════════════════════════════════

rustfmt:
  stage: lint
  image: "${RUST_IMAGE}"
  before_script:
    - apt-get update -qq && apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
  script:
    - rustc --version && cargo --version
    - cd src-tauri && rustup component add rustfmt && cargo fmt --check
  cache:
    key: lint-${CI_COMMIT_REF_SLUG}
    paths: [.cargo/, src-tauri/target/]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

clippy:
  stage: lint
  image: "${RUST_IMAGE}"
  before_script:
    - apt-get update -qq && apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
  script:
    - cd src-tauri && rustup component add clippy && cargo clippy --all-targets -- -D warnings
  allow_failure: true
  cache:
    key: clippy-${CI_COMMIT_REF_SLUG}
    paths: [.cargo/, src-tauri/target/]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ══════════════════════════════════════════════════
# STAGE 2: SECURITY — Vulnerability & license audit
# ══════════════════════════════════════════════════

cargo-audit:
  stage: security
  image: "${RUST_IMAGE}"
  before_script:
    - apt-get update -qq && apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
  script:
    - cargo install cargo-audit --locked
    - cd src-tauri && cargo audit
  cache:
    key: audit-${CI_COMMIT_REF_SLUG}
    paths: [.cargo/, src-tauri/target/]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

license-check:
  stage: security
  image: "${RUST_IMAGE}"
  before_script:
    - apt-get update -qq && apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
  script:
    - cargo install cargo-license --locked
    - cd src-tauri && cargo license --json > /tmp/licenses.json
    - python3 -c "import json; deps=json.load(open('/tmp/licenses.json')); blocked=['SSPL','BSL']; bad=[f'{d[\"name\"]}={d.get(\"license\",\"\")}' for d in deps if any(b in d.get('license','') for b in blocked)]; print('BLOCKED - ' + str(bad)) if bad else print(f'All {len(deps)} deps OK'); exit(1) if bad else None"
  cache:
    key: license-${CI_COMMIT_REF_SLUG}
    paths: [.cargo/, src-tauri/target/]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ══════════════════════════════════════════════════
# STAGE 3: BUILD — Compile release binary + download full filter lists
# ══════════════════════════════════════════════════

build-linux:
  stage: build
  image: "${RUST_IMAGE}"
  before_script:
    - apt-get update -qq && apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf curl
  script:
    # Download latest filter lists for packaging
    - curl -sfL "https://easylist.to/easylist/easylist.txt" -o filters/easylist-full.txt
    - curl -sfL "https://easylist.to/easylist/easyprivacy.txt" -o filters/easyprivacy-full.txt
    - wc -l filters/easylist-full.txt filters/easyprivacy-full.txt
    # Build
    - cd src-tauri && cargo build --release
    - ls -lh target/release/void-browser
    - file target/release/void-browser
    - sha256sum target/release/void-browser | tee target/release/void-browser.sha256
  artifacts:
    paths:
      - src-tauri/target/release/void-browser
      - src-tauri/target/release/void-browser.sha256
      - filters/easylist-full.txt
      - filters/easyprivacy-full.txt
    expire_in: 7 days
  cache:
    key: build-${CI_COMMIT_REF_SLUG}
    paths: [.cargo/, src-tauri/target/]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ══════════════════════════════════════════════════
# STAGE 4: PACKAGE — Create distributable installers
#
# This is what creates the downloadable packages:
#   Linux: .deb (Debian/Ubuntu) + .AppImage (universal)
#   Future: .dmg (macOS), .msi/.exe (Windows)
# ══════════════════════════════════════════════════

package-linux:
  stage: package
  image: "${RUST_IMAGE}"
  needs:
    - job: build-linux
      artifacts: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf file
    - cargo install tauri-cli --version "^2" --locked
  script:
    - echo "=== Building Linux packages (.deb + .AppImage) ==="
    - cargo tauri build
    - echo ""
    - echo "=== Package inventory ==="
    - find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' \) -exec ls -lh {} \;
    - echo ""
    - echo "=== Package checksums ==="
    - find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' \) -exec sha256sum {} \;
  artifacts:
    name: "void-browser-${CI_COMMIT_TAG}-linux"
    paths:
      - src-tauri/target/release/bundle/deb/
      - src-tauri/target/release/bundle/appimage/
    expire_in: 90 days
  cache:
    key: package-${CI_COMMIT_REF_SLUG}
    paths: [.cargo/, src-tauri/target/]
  rules:
    - if: $CI_COMMIT_TAG

package-windows:
  stage: package
  image: "${RUST_IMAGE}"
  needs:
    - job: build-linux
      artifacts: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq nsis nsis-pluginapi file
    - rustup target add x86_64-pc-windows-msvc
    - cargo install cargo-xwin --locked
    - cargo install tauri-cli --version "^2" --locked
  script:
    - echo "=== Cross-compiling Windows packages (.msi + .exe) ==="
    - cargo tauri build --target x86_64-pc-windows-msvc
    - echo ""
    - echo "=== Package inventory ==="
    - find src-tauri/target/x86_64-pc-windows-msvc/release/bundle -type f \( -name '*.msi' -o -name '*.exe' \) -exec ls -lh {} \;
    - echo ""
    - echo "=== Package checksums ==="
    - find src-tauri/target/x86_64-pc-windows-msvc/release/bundle -type f \( -name '*.msi' -o -name '*.exe' \) -exec sha256sum {} \;
  artifacts:
    name: "void-browser-${CI_COMMIT_TAG}-windows"
    paths:
      - src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/
      - src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/
    expire_in: 90 days
  cache:
    key: package-win-${CI_COMMIT_REF_SLUG}
    paths: [.cargo/, src-tauri/target/]
  allow_failure: true  # Cross-compilation can be flaky, don't block release
  rules:
    - if: $CI_COMMIT_TAG

package-macos:
  stage: package
  tags:
    - macos  # Requires a macOS GitLab runner (Apple SDK can't run in Linux Docker)
  needs:
    - job: build-linux
      artifacts: true
  before_script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source $HOME/.cargo/env
    - cargo install tauri-cli --version "^2" --locked
  script:
    - echo "=== Building macOS packages (.dmg) ==="
    - cargo tauri build
    - echo ""
    - echo "=== Package inventory ==="
    - find src-tauri/target/release/bundle -type f -name '*.dmg' -exec ls -lh {} \;
    - echo ""
    - echo "=== Package checksums ==="
    - find src-tauri/target/release/bundle -type f -name '*.dmg' -exec shasum -a 256 {} \;
  artifacts:
    name: "void-browser-${CI_COMMIT_TAG}-macos"
    paths:
      - src-tauri/target/release/bundle/dmg/
    expire_in: 90 days
  allow_failure: true  # Only runs when a macOS runner is available
  rules:
    - if: $CI_COMMIT_TAG

# ══════════════════════════════════════════════════
# STAGE 5: RELEASE — Create GitLab release with download links
# ══════════════════════════════════════════════════

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: package-linux
      artifacts: true
    - job: package-windows
      artifacts: true
      optional: true
    - job: package-macos
      artifacts: true
      optional: true
  script:
    - echo "=== Creating Release ${CI_COMMIT_TAG} ==="
    - echo "Linux artifacts:"
    - find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' \) -exec ls -lh {} \; 2>/dev/null || echo "  (none)"
    - echo "Windows artifacts:"
    - find src-tauri/target/x86_64-pc-windows-msvc -type f \( -name '*.msi' -o -name '*.exe' \) -exec ls -lh {} \; 2>/dev/null || echo "  (none)"
    - echo "macOS artifacts:"
    - find src-tauri/target/release/bundle -type f -name '*.dmg' -exec ls -lh {} \; 2>/dev/null || echo "  (none)"
  release:
    tag_name: "${CI_COMMIT_TAG}"
    name: "Void Browser ${CI_COMMIT_TAG}"
    description: "Void Browser ${CI_COMMIT_TAG} — No tracking. No AI. Just browsing.\n\nDownload the installer for your platform below.\nVerify downloads with the SHA-256 checksums in the job artifacts."
    assets:
      links:
        - name: "Linux (.deb) — Debian/Ubuntu"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=package-linux"
          link_type: "package"
        - name: "Linux (.AppImage) — Universal"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=package-linux"
          link_type: "package"
        - name: "Windows (.msi + .exe)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=package-windows"
          link_type: "package"
  rules:
    - if: $CI_COMMIT_TAG

# ══════════════════════════════════════════════════
# STAGE 6: DEPLOY — Website deployment with verification
# ══════════════════════════════════════════════════

deploy-site:
  stage: deploy-site
  image: alpine:latest
  needs: []
  before_script:
    - apk add --no-cache openssh-client curl
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p 22 $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - echo "=== Deploying Void Browser Website ==="
    # Copy website files
    - scp -o StrictHostKeyChecking=no website/index.html website/style.css website/Dockerfile website/robots.txt website/sitemap.xml root@$DEPLOY_HOST:/mnt/user/appdata/lightfootcloud/websites/void-browser/
    # Build and deploy container
    - ssh -o StrictHostKeyChecking=no root@$DEPLOY_HOST "cd /mnt/user/appdata/lightfootcloud/websites/void-browser && docker build -t void-website . && docker stop void-website 2>/dev/null; docker rm void-website 2>/dev/null; docker run -d --name void-website --restart unless-stopped -p 5080:80 --network proxynet --memory=128m --security-opt no-new-privileges:true void-website"
    # Health checks
    - sleep 5
    - ssh -o StrictHostKeyChecking=no root@$DEPLOY_HOST "curl -sf http://localhost:5080/ > /dev/null && echo 'Health check PASSED' || (echo 'Health check FAILED' && exit 1)"
    # Security header verification
    - ssh -o StrictHostKeyChecking=no root@$DEPLOY_HOST "curl -sI http://localhost:5080/ | grep -E '^(X-|Referrer|Content-Security|Permissions)'"
    # Tracking script gate
    - ssh -o StrictHostKeyChecking=no root@$DEPLOY_HOST "curl -s http://localhost:5080/ | grep -qi '<script[^>]*google-analytics' && echo 'TRACKING FOUND' && exit 1 || echo 'No tracking scripts - PASSED'"
    - echo "=== Deployment verified ==="
    - echo "Live at https://void.lightfoot.cloud"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - website/**/*
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  variables:
    DEPLOY_HOST: "10.0.0.10"
