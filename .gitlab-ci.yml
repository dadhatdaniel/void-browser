# ═══════════════════════════════════════════════════
# Void Browser — Enterprise CI/CD Pipeline
# Lint → Audit → Test → Build → Sign → Package → Deploy
# ═══════════════════════════════════════════════════

stages:
  - lint
  - security
  - build
  - package
  - verify
  - deploy-site

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  RUST_BACKTRACE: "1"
  RUSTFLAGS: "-D warnings"

# ══════════════════════════════════════════════════
# STAGE 1: LINT
# ══════════════════════════════════════════════════

rustfmt:
  stage: lint
  image: rust:1.80
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
  script:
    - cd src-tauri
    - rustup component add rustfmt
    - cargo fmt --check
  cache:
    key: rust-lint
    paths:
      - .cargo/
      - src-tauri/target/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

clippy:
  stage: lint
  image: rust:1.80
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
  script:
    - cd src-tauri
    - rustup component add clippy
    - cargo clippy --all-targets -- -D warnings
  allow_failure: true
  cache:
    key: rust-clippy
    paths:
      - .cargo/
      - src-tauri/target/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ══════════════════════════════════════════════════
# STAGE 2: SECURITY
# ══════════════════════════════════════════════════

cargo-audit:
  stage: security
  image: rust:1.80
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
  script:
    - cargo install cargo-audit
    - cd src-tauri
    - cargo audit
  cache:
    key: rust-audit
    paths:
      - .cargo/
      - src-tauri/target/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

license-check:
  stage: security
  image: rust:1.80
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
  script:
    - cargo install cargo-license
    - cd src-tauri
    - cargo license --json > /tmp/licenses.json
    - python3 -c "import json; deps=json.load(open('/tmp/licenses.json')); blocked=['SSPL','BSL']; bad=[f'{d[\"name\"]}={d.get(\"license\",\"\")}' for d in deps if any(b in d.get('license','') for b in blocked)]; exit(1) if bad else print(f'All {len(deps)} deps have compatible licenses')"
  cache:
    key: rust-license
    paths:
      - .cargo/
      - src-tauri/target/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

filter-list-update:
  stage: security
  image: alpine:latest
  script:
    - apk add --no-cache curl coreutils
    - cd filters
    - curl -sfL "https://easylist.to/easylist/easylist.txt" -o easylist-full.txt
    - curl -sfL "https://easylist.to/easylist/easyprivacy.txt" -o easyprivacy-full.txt
    - wc -l easylist-full.txt easyprivacy-full.txt
    - sha256sum easylist-full.txt easyprivacy-full.txt > filters-checksums.sha256
    - cat filters-checksums.sha256
  artifacts:
    paths:
      - filters/easylist-full.txt
      - filters/easyprivacy-full.txt
      - filters/filters-checksums.sha256
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ══════════════════════════════════════════════════
# STAGE 3: BUILD
# ══════════════════════════════════════════════════

build-linux:
  stage: build
  image: rust:1.80
  needs:
    - job: filter-list-update
      artifacts: true
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
  script:
    - cd src-tauri
    - cargo build --release
    - ls -lh target/release/void-browser
    - sha256sum target/release/void-browser > target/release/void-browser.sha256
    - cat target/release/void-browser.sha256
    - file target/release/void-browser
  artifacts:
    paths:
      - src-tauri/target/release/void-browser
      - src-tauri/target/release/void-browser.sha256
    expire_in: 7 days
  cache:
    key: rust-build
    paths:
      - .cargo/
      - src-tauri/target/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ══════════════════════════════════════════════════
# STAGE 4: PACKAGE
# ══════════════════════════════════════════════════

package-linux:
  stage: package
  image: rust:1.80
  needs:
    - job: build-linux
      artifacts: true
    - job: filter-list-update
      artifacts: true
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
    - cargo install tauri-cli --version "^2"
  script:
    - cargo tauri build
    - cd src-tauri/target/release/bundle
    - find . -name '*.deb' -o -name '*.AppImage' -exec ls -lh {} \;
    - find . -name '*.deb' -o -name '*.AppImage' -exec sha256sum {} \;
  artifacts:
    paths:
      - src-tauri/target/release/bundle/deb/
      - src-tauri/target/release/bundle/appimage/
    expire_in: 90 days
  cache:
    key: rust-package
    paths:
      - .cargo/
      - src-tauri/target/
  rules:
    - if: $CI_COMMIT_TAG

# ══════════════════════════════════════════════════
# STAGE 5: VERIFY
# ══════════════════════════════════════════════════

verify-binary:
  stage: verify
  image: ubuntu:22.04
  needs:
    - job: build-linux
      artifacts: true
  script:
    - apt-get update -qq && apt-get install -y -qq file binutils
    - BINARY="src-tauri/target/release/void-browser"
    - echo "=== Binary Verification ==="
    - file "$BINARY"
    - readelf -d "$BINARY" 2>/dev/null | grep NEEDED | head -20 || true
    - readelf -l "$BINARY" 2>/dev/null | grep -c GNU_RELRO || true
    - readelf -h "$BINARY" 2>/dev/null | grep -i type
    - sha256sum --check "$BINARY.sha256"
    - echo "Binary verified"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ══════════════════════════════════════════════════
# STAGE 6: DEPLOY WEBSITE
# ══════════════════════════════════════════════════

deploy-site:
  stage: deploy-site
  image: alpine:latest
  needs: []
  before_script:
    - apk add --no-cache openssh-client curl
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p 22 $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - echo "Deploying Void Browser Website"
    - scp -o StrictHostKeyChecking=no website/index.html website/style.css website/Dockerfile website/robots.txt website/sitemap.xml root@$DEPLOY_HOST:/mnt/user/appdata/lightfootcloud/websites/void-browser/
    - ssh -o StrictHostKeyChecking=no root@$DEPLOY_HOST "cd /mnt/user/appdata/lightfootcloud/websites/void-browser && docker build -t void-website . && docker stop void-website 2>/dev/null; docker rm void-website 2>/dev/null; docker run -d --name void-website --restart unless-stopped -p 5080:80 --network proxynet --memory=128m --security-opt no-new-privileges:true void-website"
    - sleep 5
    - ssh -o StrictHostKeyChecking=no root@$DEPLOY_HOST "curl -sf http://localhost:5080/ > /dev/null && echo 'Health check PASSED' || (echo 'Health check FAILED' && exit 1)"
    - ssh -o StrictHostKeyChecking=no root@$DEPLOY_HOST "curl -sI http://localhost:5080/ | grep -E '^(X-|Referrer|Content-Security|Permissions)'"
    - ssh -o StrictHostKeyChecking=no root@$DEPLOY_HOST "curl -s http://localhost:5080/ | grep -qi '<script[^>]*google-analytics' && echo 'TRACKING FOUND' && exit 1 || echo 'No tracking scripts'"
    - echo "Deployment complete"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - website/**/*
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  variables:
    DEPLOY_HOST: "10.0.0.10"
