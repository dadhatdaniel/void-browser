# ═══════════════════════════════════════════════════
# Void Browser — GitLab CI (Internal)
#
# BUILDS: All builds (Linux/Windows/macOS) run on GitHub Actions
#         See: .github/workflows/build.yml
#         Repo: https://github.com/dadhatdaniel/void-browser
#
# THIS PIPELINE HANDLES:
#   1. LINT (every push) — code quality gates
#   2. SECURITY (main + tags) — vulnerability + license audit
#   3. DEPLOY-SITE (main) — website deployment with health checks
#
# TO CREATE A RELEASE:
#   git tag v0.1.0 && git push origin v0.1.0
#   → GitLab mirror pushes to GitHub → Actions builds all 3 platforms
# ═══════════════════════════════════════════════════

stages:
  - lint
  - security
  - scan
  - deploy-site
  - e2e
  - notify

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  RUST_BACKTRACE: "1"
  RUSTFLAGS: "-D warnings"
  RUST_IMAGE: "rust:latest"

# ── LINT ─────────────────────────────────────────

rustfmt:
  stage: lint
  image: "${RUST_IMAGE}"
  before_script:
    - apt-get update -qq && apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
  script:
    - rustc --version && cargo --version
    - cd src-tauri && rustup component add rustfmt && cargo fmt --check
  cache:
    key: lint-${CI_COMMIT_REF_SLUG}
    paths: [.cargo/, src-tauri/target/]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

clippy:
  stage: lint
  image: "${RUST_IMAGE}"
  before_script:
    - apt-get update -qq && apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
  script:
    - cd src-tauri && rustup component add clippy && cargo clippy --all-targets -- -D warnings
  allow_failure: true
  cache:
    key: clippy-${CI_COMMIT_REF_SLUG}
    paths: [.cargo/, src-tauri/target/]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ── SECURITY ─────────────────────────────────────

cargo-audit:
  stage: security
  image: "${RUST_IMAGE}"
  before_script:
    - apt-get update -qq && apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
  script:
    - cargo install cargo-audit --locked
    - cd src-tauri && cargo audit
  cache:
    key: audit-${CI_COMMIT_REF_SLUG}
    paths: [.cargo/, src-tauri/target/]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

license-check:
  stage: security
  image: "${RUST_IMAGE}"
  before_script:
    - apt-get update -qq && apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
  script:
    - cargo install cargo-license --locked
    - cd src-tauri && cargo license --json > /tmp/licenses.json
    - python3 -c "import json; deps=json.load(open('/tmp/licenses.json')); blocked=['SSPL-1.0','BUSL-1.1']; bad=[f'{d[\"name\"]}={d.get(\"license\",\"\")}' for d in deps if any(d.get('license','').startswith(b) for b in blocked)]; print('BLOCKED - ' + str(bad)) if bad else print(f'All {len(deps)} deps OK'); exit(1) if bad else None"
  cache:
    key: license-${CI_COMMIT_REF_SLUG}
    paths: [.cargo/, src-tauri/target/]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ── VIRUSTOTAL (optional) ────────────────────────
# Add GitLab CI/CD variable: VIRUSTOTAL_API_KEY (masked, protected optional)
# Optional: GITHUB_TOKEN (read-only) for higher GitHub asset download limits
# Job writes website/scan-results.json — never calls VT from the browser.

virus-scan:
  stage: scan
  image: python:3.12-alpine
  timeout: 2h
  needs: []
  variables:
    # Bump when a newer GitHub Release exists with assets
    VT_RELEASE_TAG: "v0.1.0-alpha.6"
    VT_WEBSITE_URL: "https://void.lightfoot.cloud"
  script:
    - |
      set -e
      if [ -z "${VIRUSTOTAL_API_KEY:-}" ]; then
        echo "VIRUSTOTAL_API_KEY not set — writing pending placeholder (no fake scores)."
        python3 scripts/virustotal-scan.py --dry-run
      else
        echo "VirusTotal key present (value not printed). Scanning website + release assets..."
        python3 scripts/virustotal-scan.py
      fi
    - test -f website/scan-results.json
    - python3 -c "import json; d=json.load(open('website/scan-results.json')); print('status=', d.get('status'), 'artifacts=', len(d.get('artifacts') or []), 'site=', (d.get('website') or {}).get('positives'), '/', (d.get('website') or {}).get('total'))"
  artifacts:
    paths:
      - website/scan-results.json
    expire_in: 30 days
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true

# ── DEPLOY WEBSITE ───────────────────────────────

deploy-site:
  stage: deploy-site
  image: alpine:latest
  needs: []
  before_script:
    - apk add --no-cache openssh-client curl
    - mkdir -p ~/.ssh
    - cp "$DEPLOY_SSH_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p 22 $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - echo "=== Deploying Void Browser Website ==="
    - scp -o StrictHostKeyChecking=no website/index.html website/style.css website/Dockerfile website/robots.txt website/sitemap.xml website/ai.txt website/tdmrep.json website/favicon.ico website/favicon-32.png website/favicon-192.png website/favicon-512.png website/apple-touch-icon.png website/site.webmanifest website/manifest.json website/releases.json website/scan-results.json root@$DEPLOY_HOST:/mnt/user/appdata/lightfootcloud/websites/void-browser/
    - ssh -o StrictHostKeyChecking=no root@$DEPLOY_HOST "cd /mnt/user/appdata/lightfootcloud/websites/void-browser && docker build -t void-website . && docker stop void-website 2>/dev/null; docker rm void-website 2>/dev/null; docker run -d --name void-website --restart unless-stopped -p 5080:80 --network proxynet --memory=128m --security-opt no-new-privileges:true void-website"
    - sleep 5
    - ssh -o StrictHostKeyChecking=no root@$DEPLOY_HOST "curl -sf http://localhost:5080/ > /dev/null && echo 'Health check PASSED' || (echo 'Health check FAILED' && exit 1)"
    - ssh -o StrictHostKeyChecking=no root@$DEPLOY_HOST "curl -sf http://localhost:5080/releases.json > /dev/null && echo 'releases.json OK' || (echo 'releases.json MISSING' && exit 1)"
    - ssh -o StrictHostKeyChecking=no root@$DEPLOY_HOST "curl -sf http://localhost:5080/scan-results.json > /dev/null && echo 'scan-results.json OK' || (echo 'scan-results.json MISSING' && exit 1)"
    - ssh -o StrictHostKeyChecking=no root@$DEPLOY_HOST "curl -sf -o /dev/null -w '%{http_code}' http://localhost:5080/manifest.json | grep -q 200 && echo 'manifest.json OK' || (echo 'manifest.json FAILED' && exit 1)"
    - ssh -o StrictHostKeyChecking=no root@$DEPLOY_HOST "curl -sI http://localhost:5080/ | grep -E '^(X-|Referrer|Content-Security|Permissions)'"
    - ssh -o StrictHostKeyChecking=no root@$DEPLOY_HOST "curl -s http://localhost:5080/ | grep -qi '<script[^>]*google-analytics' && echo 'TRACKING FOUND' && exit 1 || echo 'No tracking scripts - PASSED'"
    - echo "=== Deployment verified ==="
    - echo "Live at https://void.lightfoot.cloud"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - website/**/*
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  variables:
    DEPLOY_HOST: "10.0.0.10"

# ── SITE E2E SMOKE (every main push) ─────────────
# Hits the live container on the deploy host (:5080). Cloudflare may challenge
# https://void.lightfoot.cloud for bots — CI uses the origin port instead.

site-e2e:
  stage: e2e
  image: alpine:latest
  needs: []
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -eu
      BASE="${SITE_E2E_BASE:-http://10.0.0.10:5080}"
      echo "=== Site E2E against $BASE ==="
      for path in / /manifest.json /releases.json /scan-results.json /robots.txt /sitemap.xml /style.css /favicon.ico; do
        code=$(curl -sS -o /tmp/e2e-body -w '%{http_code}' "$BASE$path" || echo "000")
        echo "$code $path"
        test "$code" = "200"
      done
      curl -sf "$BASE/releases.json" -o /tmp/releases.json
      jq -e '.tag and .assets' /tmp/releases.json >/dev/null
      jq -r '.assets | to_entries[] | .value.url' /tmp/releases.json > /tmp/download-urls.txt
      while IFS= read -r url; do
        [ -z "$url" ] && continue
        code=$(curl -sS -I -L -o /dev/null -w '%{http_code}' --max-time 60 "$url" || echo "000")
        echo "$code download $url"
        echo "$code" | grep -Eq '^(200|302)$'
      done < /tmp/download-urls.txt
      curl -sf "$BASE/scan-results.json" -o /tmp/scan.json
      jq -e '.status and (.website or .artifacts)' /tmp/scan.json >/dev/null
      status=$(jq -r '.status' /tmp/scan.json)
      echo "scan-results status=$status"
      if [ "$status" = "pending" ]; then
        echo "WARNING: scan-results still pending (VT key missing or scan not run)"
      else
        jq -e '(.website.total // 0) > 0 or ((.artifacts // []) | length) > 0' /tmp/scan.json >/dev/null
        echo "VT scores present"
      fi
      curl -sf "$BASE/" -o /tmp/index.html
      if grep -Eiq '<script[^>]*google-analytics|googletagmanager' /tmp/index.html; then
        echo 'TRACKING FOUND'
        exit 1
      fi
      echo 'No tracking scripts'
      # Void background (canvas starfield) + download badges
      curl -sf "$BASE/style.css" -o /tmp/style.css
      grep -Eq 'void-bg|void-canvas|void-nebula' /tmp/index.html
      grep -Eq 'void-bg|void-canvas' /tmp/style.css
      echo 'void starfield OK'
      grep -Eq 'download-badges|shields\.io' /tmp/index.html
      echo 'download badges OK'
      echo "=== Site E2E PASSED ==="
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    SITE_E2E_BASE: "http://10.0.0.10:5080"

# ── TRIGGER GITHUB BUILD (tags) ──────────────────
# GitLab push-mirror often updates tag refs without a GitHub tag PushEvent,
# so Actions never starts. This job explicitly dispatches Build & Release.
# Requires GITHUB_TOKEN with Actions: write (workflow scope).

trigger-github-build:
  stage: notify
  image: alpine:latest
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -eu
      if [ -z "${GITHUB_TOKEN:-}" ]; then
        echo "GITHUB_TOKEN not set — cannot dispatch GitHub Actions"
        exit 1
      fi
      echo "Dispatching Build & Release for ref=$CI_COMMIT_TAG"
      code=$(curl -sS -o /tmp/gh-dispatch.json -w '%{http_code}' \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        "https://api.github.com/repos/dadhatdaniel/void-browser/actions/workflows/build.yml/dispatches" \
        -d "{\"ref\":\"$CI_COMMIT_TAG\"}")
      echo "HTTP $code"
      cat /tmp/gh-dispatch.json || true
      if [ "$code" = "204" ] || [ "$code" = "200" ]; then
        echo "GitHub workflow_dispatch accepted"
        exit 0
      fi
      if [ "$code" = "403" ] || [ "$code" = "401" ]; then
        echo "BLOCKER: GITHUB_TOKEN lacks actions:write — open Actions → Build & Release → Run workflow on tag $CI_COMMIT_TAG"
        echo "Also ensure TAURI_SIGNING_PRIVATE_KEY is set on GitHub Environment 'release' for updater artifacts."
        exit 1
      fi
      echo "Unexpected response"
      exit 1
  allow_failure: true
  variables:
    DEPLOY_HOST: "10.0.0.10"
